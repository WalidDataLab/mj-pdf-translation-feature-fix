name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "logs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  UPSTREAM_ZIP: https://gitlab.com/mudlej_android/mj_pdf_reader/-/archive/main/mj_pdf_reader-main.zip
  # Every ABI, so the universal APK runs on 32-bit and 64-bit phones.
  ABI: all
  NDK_VERSION: 28.2.13676358
  # Signing key for this personal build (private repository).
  KEYSTORE_PASSWORD: 31b574ec578252f8ae1bde36ea66e75c
  KEY_ALIAS: mjfix

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download upstream MJ PDF source
        run: |
          set -o pipefail
          curl -fL --retry 3 -o upstream.zip "$UPSTREAM_ZIP" 2>&1 | tee -a build.log
          unzip -q upstream.zip
          mv mj_pdf_reader-main src
          rm upstream.zip

      - name: Apply this project's changes
        run: |
          set -o pipefail
          python3 ci/apply_changes.py src 2>&1 | tee -a build.log

      - name: Install Android SDK parts
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" 2>&1 | tail -5 | tee -a build.log
          pip3 install --break-system-packages requests 2>&1 | tail -1 || pip3 install requests

      - name: Restore native libraries cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: src/PdfiumAndroid/src/main/libs
          key: native-${{ env.ABI }}-${{ hashFiles('src/build_dependencies/**', 'src/PdfiumAndroid/src/main/jni/**') }}

      - name: Build native libraries (PDFium with Arabic patches)
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          set -o pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          python3 build_dependencies.py --abi "$ABI" 2>&1 | tee -a ../build.log | tail -200
          rm -rf pdfium depot_tools || true
          df -h /

      - name: Save native libraries cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/PdfiumAndroid/src/main/libs
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Build release APK
        working-directory: src
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../build.log | tail -200

      - name: Prepare signing key (created once, then reused)
        run: |
          if [ ! -f ci/release.p12 ]; then
            keytool -genkeypair -keystore ci/release.p12 -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=WalidDataLab, O=mj-pdf-translation-feature-fix"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add ci/release.p12
            git commit -m "Add signing key for this personal build"
            git pull --rebase && git push
          fi

      - name: Sign APK
        run: |
          set -o pipefail
          unsigned=$(find src/app/build/outputs/apk/release -name '*universal*.apk' | head -n1)
          echo "Unsigned APK: $unsigned" | tee -a build.log
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks ci/release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out MJ-PDF-Fix.apk "$unsigned" 2>&1 | tee -a build.log
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs MJ-PDF-Fix.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: MJ-PDF-Fix
          path: MJ-PDF-Fix.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" MJ-PDF-Fix.apk \
            --title "MJ PDF Fix - build ${{ github.run_number }}" \
            --notes "Universal APK (arm64-v8a, armeabi-v7a, x86, x86_64) built from upstream MJ PDF main with the changes in ci/apply_changes.py. Download MJ-PDF-Fix.apk below and install it on the phone."

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p logs
          tail -n 400 build.log > logs/last-failure.log 2>/dev/null || echo "no build.log" > logs/last-failure.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add logs/last-failure.log
          git commit -m "Build log of failed run ${{ github.run_number }}"
          git pull --rebase && git push
